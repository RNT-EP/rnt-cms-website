<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="css/globals.css" />
    <link rel="stylesheet" href="css/styleguide.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- header-style-3 start-->
    <header class="header--style-3" id="header">
        <div class="container-fluid">
            <!-- Mostra os componentes -->
            <div id="mini-header-container"></div>
			<div id="header-menu"></div>
        </div>
    </header>
    <!-- header-style-3 end-->

    <script>
        // Função para carregar componentes
        function loadComponent(id, filePath) {
            fetch(filePath)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Erro ao carregar o componente: ${filePath}`);
                    }
                    return response.text();
                })
                .then(html => {
                    document.getElementById(id).innerHTML = html;
                })
                .catch(err => console.error(err));
        }

        // Carregando os componentes
        loadComponent('mini-header-container', 'components/mini-header.html');
		loadComponent('header-menu', 'components/header.html');
    </script>

  </body>
</html>
