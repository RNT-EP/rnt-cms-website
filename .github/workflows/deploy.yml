name: Deploy RNT Website
on:
  push:
    branches:
      - dev
jobs:
  deploy:
    strategy:
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4

      - name: Restore dependencies
        run: dotnet restore RNTWebsite/RNTWebsite.csproj

      - name: Build project
        run: dotnet build --configuration Release RNTWebsite/RNTWebsite.csproj

      - name: Run test
        run: dotnet test RNTWebsite/RNTWebsite.csproj

      - name: Publish project
        run: dotnet publish RNTWebsite/RNTWebsite.csproj --configuration Release --output ./publish

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}  # Token de autenticação do Netlify
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}  # ID do seu site no Netlify
        run: |
          curl -X POST -F "file=@./publish" \
          -F "site_id=${{ secrets.NETLIFY_SITE_ID }}" \
          -F "auth_token=${{ secrets.NETLIFY_AUTH_TOKEN }}" \
          https://api.netlify.com/api/v1/sites/${{ secrets.NETLIFY_SITE_ID }}/deploys
