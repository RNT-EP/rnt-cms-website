name: Deploy RNT Website
on:
  push:
    branches:
      - dev
jobs:
  deploy:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4

      - name: Restore dependencies
        run: dotnet restore RNTWebsite/RNTWebsite.csproj

      - name: Build project
        run: dotnet build --configuration Release RNTWebsite/RNTWebsite.csproj

      - name: Run test
        run: dotnet test RNTWebsite/RNTWebsite.csproj

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Website
          path: RNTWebsite/bin/Release
