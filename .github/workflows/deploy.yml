name: Deploy RNT Website
on:
  push:
    branches:
      - dev
jobs:
  deploy:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0

      - name: Restore dependencies
        run: dotnet restore RNTWebsite/RNTWebsite.csproj

      - name: Build project
        run: dotnet build --configuration Release RNTWebsite/RNTWebsite.csproj

      - name: Run Umbraco locally
        run: dotnet run --project "RNTWebsite"
        timeout-minutes: 0.17
